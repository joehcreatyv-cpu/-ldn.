name: Mise à jour des résultats
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data/results.json
          git diff --staged --quiet || (git commit -m "Mise à jour des résultats" && git push)
